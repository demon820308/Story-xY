<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Dark Ink Navy Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c204d"/>
      <stop offset="50%" stop-color="#081431"/>
      <stop offset="100%" stop-color="#04091a"/>
    </linearGradient>

    <!-- Subtle Cyan Ambient Radial Glow -->
    <radialGradient id="cyanAmbient" cx="80%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.28"/>
      <stop offset="45%" stop-color="#0891b2" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#081431" stop-opacity="0"/>
    </radialGradient>

    <!-- Soft Center Backlight for the Character -->
    <radialGradient id="centerGlow" cx="48%" cy="54%" r="52%">
      <stop offset="0%" stop-color="#152b5c" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#081431" stop-opacity="0"/>
    </radialGradient>

    <!-- Character Gold/Cream Paper Gradient -->
    <linearGradient id="creamGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="20%" stop-color="#FCF8F0"/>
      <stop offset="80%" stop-color="#F5E8CE"/>
      <stop offset="100%" stop-color="#EBD5B0"/>
    </linearGradient>

    <!-- Star Luminous Cyan Gradient -->
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="25%" stop-color="#A5F3FC"/>
      <stop offset="60%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>

    <!-- Star Glow -->
    <radialGradient id="starGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.95"/>
      <stop offset="25%" stop-color="#0891B2" stop-opacity="0.55"/>
      <stop offset="65%" stop-color="#0891B2" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#081431" stop-opacity="0"/>
    </radialGradient>

    <!-- Drop Shadow Filter for Character -->
    <filter id="charShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#02050E" flood-opacity="0.65"/>
    </filter>

    <!-- Outer Bevel / Border -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.50"/>
      <stop offset="35%" stop-color="#22D3EE" stop-opacity="0.22"/>
      <stop offset="70%" stop-color="#F7EDD8" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#040A1C" stop-opacity="0.6"/>
    </linearGradient>

    <clipPath id="squircleClip">
      <rect x="0" y="0" width="512" height="512" rx="112" ry="112"/>
    </clipPath>
  </defs>

  <!-- Masked base icon -->
  <g clip-path="url(#squircleClip)">
    <!-- Main Background -->
    <rect x="0" y="0" width="512" height="512" fill="url(#bgGrad)"/>
    <rect x="0" y="0" width="512" height="512" fill="url(#centerGlow)"/>
    <rect x="0" y="0" width="512" height="512" fill="url(#cyanAmbient)"/>

    <!-- Subtle fine celestial / concentric arc accents -->
    <circle cx="256" cy="256" r="215" fill="none" stroke="#22d3ee" stroke-opacity="0.05" stroke-width="1.5"/>
    <circle cx="256" cy="256" r="165" fill="none" stroke="#f7edd8" stroke-opacity="0.03" stroke-width="1"/>

    <!-- Character "文" -->
    <g filter="url(#charShadow)">
      <path d="M377 847 383 852Q513 844 565.0 801.5Q617 759 612.5 713.0Q608 667 568.0 645.5Q528 624 473 658Q449 769 377 847ZM637 594H265Q299 476 360.0 388.5Q421 301 504 238Q616 397 637 594ZM935 594H812Q771 345 608 171Q777 83 978 46L975 34Q865 16 825 -96Q638 -34 504 83Q331 -42 31 -94L27 -84Q292 7 434 155Q301 312 248 594H45L37 622H740L821 732Q821 732 871.0 691.0Q921 650 964 610Q958 594 935 594Z"
            transform="translate(80.20, 397.22) scale(0.3260, -0.3260)"
            fill="url(#creamGrad)"/>
    </g>

    <!-- Star Glow Behind Star -->
    <circle cx="404" cy="108" r="85" fill="url(#starGlow)"/>

    <!-- Main Cyan Star -->
    <g transform="translate(404, 108)">
      <path d="M 0 -44 Q 0 -11 44 0 Q 0 11 0 44 Q 0 11 -44 0 Q 0 -11 0 -44 Z" fill="url(#starGrad)"/>
      <circle cx="0" cy="0" r="5" fill="#FFFFFF"/>
    </g>

    <!-- Inner Highlight Rim -->
    <rect x="2" y="2" width="508" height="508" rx="111" ry="111"
          fill="none" stroke="url(#borderGrad)" stroke-width="3"/>
  </g>
</svg>
