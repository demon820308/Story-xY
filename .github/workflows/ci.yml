name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  story-guards:
    name: Story-xY Core Guards
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: npm ci
      - name: Static check
        run: python scripts/static-check.py
      - name: Skill workflow numbering check
        run: python scripts/skill-numbering.py check
      - name: Doc budget check
        run: node scripts/run-doc-budget.js
      - name: Agent notes format check
        run: python scripts/check-agent-notes.py
      - name: Pi agents synchronization check
        run: python scripts/generate-pi-agents.py --check
      - name: Story unit tests
        run: node --test test/story-agent-resolver.test.mjs test/story-agents-lock.test.mjs test/story-short-outline.test.mjs
      - name: TypeScript typecheck
        run: npx tsc --noEmit
      - name: ESLint
        run: npm run lint
